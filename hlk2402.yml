esphome:
  name: keting2410c
  friendly_name: "海凌科2402"
  
  # 自动初始化雷达
  on_boot:
    priority: 600
    then:
      - delay: 3s
      - logger.log: "正在初始化雷达进入工程模式..."
      # 使用 YAML 方式写，不受 lambda 限制
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFF, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]
      - delay: 500ms
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x08, 0x00, 0x12, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x00, 0x04, 0x03, 0x02, 0x01]
      - delay: 500ms
      - uart.write: [0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0xFE, 0x00, 0x04, 0x03, 0x02, 0x01]

esp8266:
  board: d1_mini

# 重要：关闭波特率输出，防止干扰串口解析
logger:
  baud_rate: 0

