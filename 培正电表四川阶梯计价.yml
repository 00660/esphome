# ================= 核心：全局变量数据库 (原封不动) =================
globals:
  # 状态标记
  - id: g_boot_complete
    type: bool
    initial_value: 'false'
  
  # 上次计算时的电表总读数
  - id: g_last_energy_reading
    type: float
    restore_value: yes
    initial_value: '0.0'

  # --- 余额 ---
  - id: g_balance
    type: float
    restore_value: yes
    initial_value: '0.0'

  # --- 今日数据 ---
  - id: g_today_usage
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_today_cost
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_today_peak_usage
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_today_peak_cost
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_today_valley_usage
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_today_valley_cost
    type: float
    restore_value: yes
    initial_value: '0.0'

  # --- 本月数据 ---
  - id: g_month_usage
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_month_cost
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_month_peak_usage
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_month_peak_cost
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_month_valley_usage
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_month_valley_cost
    type: float
    restore_value: yes
    initial_value: '0.0'

  # --- 历史数据 (昨日/上月) ---
  - id: g_yesterday_usage
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_yesterday_cost
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_last_month_usage
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: g_last_month_cost
    type: float
    restore_value: yes
    initial_value: '0.0'

  # --- 年度与重置 ---
  - id: g_year_base_offset
    type: float
    restore_value: yes
    initial_value: '0.0'

# ================= 硬件配置 (原封不动) =================

uart:
  # 雷达 UART
  - id: uart_radar
    tx_pin: GPIO3
    rx_pin: GPIO2
    baud_rate: 115200
    parity: NONE
    stop_bits: 1
  # 电表 UART
  - id: uart_pzem
    tx_pin: GPIO21
    rx_pin: GPIO20
    baud_rate: 9600

modbus:
  - id: modbus_pzem
    uart_id: uart_pzem

# 雷达组件
external_components:
  - source:
      type: git
      url: https://gh-proxy.com/https://github.com/Mc-Joung/hlk_ld2402_esphome

hlk_ld2402:
  uart_id: uart_radar
  id: radar_device
  max_distance: 5.0
  timeout: 5

# 时间同步 (保持你的逻辑)
time:
  - platform: homeassistant
    id: sntp_time
    timezone: Asia/Shanghai
    
    on_time:
      # === 每日重置 (00:00:00) ===
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              // 转移今日数据到昨日
              id(g_yesterday_usage) = id(g_today_usage);
              id(g_yesterday_cost) = id(g_today_cost);
              
              // 清零今日
              id(g_today_usage) = 0.0;
              id(g_today_cost) = 0.0;
              id(g_today_peak_usage) = 0.0;
              id(g_today_peak_cost) = 0.0;
              id(g_today_valley_usage) = 0.0;
              id(g_today_valley_cost) = 0.0;

      # === 每月重置 (1号 00:00:00) ===
      - seconds: 0
        minutes: 0
        hours: 0
        days_of_month: 1
        then:
          - lambda: |-
              // 转移本月数据到上月
              id(g_last_month_usage) = id(g_month_usage);
              id(g_last_month_cost) = id(g_month_cost);
              
              // 记录年度偏移量 (因为PZEM清零了)
              id(g_year_base_offset) += id(g_month_usage);
              
              // 清零本月
              id(g_month_usage) = 0.0;
              id(g_month_cost) = 0.0;
              id(g_month_peak_usage) = 0.0;
              id(g_month_peak_cost) = 0.0;
              id(g_month_valley_usage) = 0.0;
              id(g_month_valley_cost) = 0.0;

              // 重置计算锚点
              id(g_last_energy_reading) = 0.0;

          # 硬件清零电表
          - pzemac.reset_energy: pzem_sensor
          - delay: 2s
          # 强制刷新一次确保读数变回0
          - component.update: pzem_sensor

# ================= 核心计算逻辑 (心跳 - 原封不动) =================
interval:
  - interval: 3s
    then:
      - lambda: |-
          // 1. 安全检查
          if (!id(sntp_time).now().is_valid()) return;
          if (isnan(id(pzem_total_energy).state)) return;
          
          float current_total = id(pzem_total_energy).state;
          
          // 2. 初始化逻辑
          if (!id(g_boot_complete)) {
            id(g_last_energy_reading) = current_total;
            id(g_boot_complete) = true;
            return; 
          }

          // 3. 计算增量 (Delta)
          float delta = current_total - id(g_last_energy_reading);
          
          // 异常处理：电表重置
          if (delta < 0) {
             delta = current_total;
          }
          
          // 忽略微小误差
          if (delta < 0.0001) {
            id(g_last_energy_reading) = current_total;
            return;
          }

          // 4. 判断峰谷 (7:00 - 23:00 为峰)
          int hour = id(sntp_time).now().hour;
          int month = id(sntp_time).now().month;
          bool is_peak = (hour >= 7 && hour < 23);

          // 5. 判断阶梯电价
          float m_usage = id(g_month_usage); 
          float price = 0.0;

          float base_p = 0.5224;
          float valley_p = (month >= 6 && month <= 10) ? 0.175 : 0.235;
          
          if (m_usage > 180 && m_usage <= 280) {
             base_p = 0.6224;
             valley_p = (month >= 6 && month <= 10) ? 0.275 : 0.335;
          } else if (m_usage > 280) {
             base_p = 0.8224;
             valley_p = (month >= 6 && month <= 10) ? 0.475 : 0.535;
          }
          
          if (is_peak) {
             price = base_p; 
          } else {
             price = valley_p;
          }

          // 6. 核心累加
          float cost = delta * price;

          id(g_today_usage) += delta;
          id(g_today_cost) += cost;
          
          id(g_month_usage) += delta;
          id(g_month_cost) += cost;
          
          id(g_balance) -= cost;
          if (id(g_balance) < 0) id(g_balance) = 0;

          if (is_peak) {
            id(g_today_peak_usage) += delta;
            id(g_today_peak_cost) += cost;
            id(g_month_peak_usage) += delta;
            id(g_month_peak_cost) += cost;
          } else {
            id(g_today_valley_usage) += delta;
            id(g_today_valley_cost) += cost;
            id(g_month_valley_usage) += delta;
            id(g_month_valley_cost) += cost;
          }

          // 7. 保存断点
          id(g_last_energy_reading) = current_total;

# ================= 传感器定义 (仅加 Emoji 和 英文后缀) =================

sensor:
  # --- 纯硬件读数 ---
  - platform: pzemac
    id: pzem_sensor
    modbus_id: modbus_pzem
    update_interval: 3s
    current:
      name: "🔌 电流 (Current)"
      accuracy_decimals: 3
    voltage:
      name: "⚡ 电压 (Voltage)"
      accuracy_decimals: 1
    power:
      name: "🔥 功率 (Power)"
      accuracy_decimals: 1
    frequency:
      name: "〰️ 频率 (Frequency)"
      accuracy_decimals: 1
    power_factor:
      name: "💎 功率因数 (Power Factor)"
      accuracy_decimals: 2
    energy:
      name: "📑 累计总电量 (Total Energy)"
      id: pzem_total_energy
      unit_of_measurement: kWh
      filters:
        - multiply: 0.001
      accuracy_decimals: 3

  - platform: adc
    pin: 1
    name: "☀️ 光照度 (Illuminance)"
    update_interval: 10s
    unit_of_measurement: lx
    filters:
      - lambda: return (x / 10000.0) * 2000000.0;

  - platform: hlk_ld2402
    id: radar_dist
    name: "📏 雷达距离 (Radar Dist)"
    hlk_ld2402_id: radar_device
    device_class: distance
    unit_of_measurement: "cm"

  # --- 显示型传感器 ---
  
  - platform: template
    name: "💰 电费余额 (Balance)"
    unit_of_measurement: CNY
    accuracy_decimals: 2
    lambda: return id(g_balance);
    update_interval: 3s

  - platform: template
    name: "💹 当前电价 (Price)"
    unit_of_measurement: '元/度'
    accuracy_decimals: 4
    update_interval: 10s
    lambda: |-
      int month = id(sntp_time).now().month;
      float m_usage = id(g_month_usage);
      int hour = id(sntp_time).now().hour;
      bool is_valley = (hour >= 23 || hour < 7);
      
      float base = 0.5224;
      float valley = (month >= 6 && month <= 10) ? 0.175 : 0.235;

      if (m_usage > 180 && m_usage <= 280) {
         base = 0.6224;
         valley = (month >= 6 && month <= 10) ? 0.275 : 0.335;
      } else if (m_usage > 280) {
         base = 0.8224;
         valley = (month >= 6 && month <= 10) ? 0.475 : 0.535;
      }
      return is_valley ? valley : base;

  - platform: template
    name: "📊 本月总用量 (Month Usage)"
    unit_of_measurement: kWh
    accuracy_decimals: 3
    lambda: return id(g_month_usage);
    update_interval: 5s
    
  - platform: template
    name: "📅 本月电费 (Month Bill)"
    unit_of_measurement: CNY
    accuracy_decimals: 2
    lambda: return id(g_month_cost);
    update_interval: 5s

  - platform: template
    name: "📈 本月峰段用量 (Month Peak Usage)"
    unit_of_measurement: kWh
    accuracy_decimals: 3
    lambda: return id(g_month_peak_usage);
    update_interval: 5s

  - platform: template
    name: "📅 本月峰段电费 (Month Peak Bill)"
    unit_of_measurement: CNY
    accuracy_decimals: 2
    lambda: return id(g_month_peak_cost);
    update_interval: 5s

  - platform: template
    name: "📉 本月谷段用量 (Month Valley Usage)"
    unit_of_measurement: kWh
    accuracy_decimals: 3
    lambda: return id(g_month_valley_usage);
    update_interval: 5s

  - platform: template
    name: "📅 本月谷段电费 (Month Valley Bill)"
    unit_of_measurement: CNY
    accuracy_decimals: 2
    lambda: return id(g_month_valley_cost);
    update_interval: 5s

  - platform: template
    name: "📈 今日用量 (Today Usage)"
    unit_of_measurement: kWh
    accuracy_decimals: 3
    lambda: return id(g_today_usage);
    update_interval: 3s

  - platform: template
    name: "📅 今日电费 (Today Bill)"
    unit_of_measurement: CNY
    accuracy_decimals: 2
    lambda: return id(g_today_cost);
    update_interval: 3s
  
  - platform: template
    name: "📈 今日峰段用量 (Today Peak Usage)"
    unit_of_measurement: kWh
    accuracy_decimals: 3
    lambda: return id(g_today_peak_usage);
    update_interval: 5s

  - platform: template
    name: "📅 今日峰段电费 (Today Peak Bill)"
    unit_of_measurement: CNY
    accuracy_decimals: 2
    lambda: return id(g_today_peak_cost);
    update_interval: 5s

  - platform: template
    name: "📉 今日谷段用量 (Today Valley Usage)"
    unit_of_measurement: kWh
    accuracy_decimals: 3
    lambda: return id(g_today_valley_usage);
    update_interval: 5s

  - platform: template
    name: "📅 今日谷段电费 (Today Valley Bill)"
    unit_of_measurement: CNY
    accuracy_decimals: 2
    lambda: return id(g_today_valley_cost);
    update_interval: 5s

  - platform: template
    name: "🗓️ 年度实际用量 (Annual Usage)"
    unit_of_measurement: kWh
    accuracy_decimals: 3
    lambda: return id(g_year_base_offset) + id(pzem_total_energy).state;
    update_interval: 10s

  - platform: template
    name: "⏪ 昨日电费 (Yesterday Bill)"
    unit_of_measurement: CNY
    accuracy_decimals: 2
    lambda: return id(g_yesterday_cost);
    update_interval: 60s
  
  - platform: template
    name: "🔙 上月电费 (Last Month Bill)"
    unit_of_measurement: CNY
    accuracy_decimals: 2
    lambda: return id(g_last_month_cost);
    update_interval: 60s

  - platform: wifi_signal
    name: "📶 WiFi信号 (WiFi Signal)"
    update_interval: 60s

binary_sensor:
  - platform: hlk_ld2402
    id: radar_presence
    name: "🏠 存在感应 (Presence)"
    device_class: presence
    hlk_ld2402_id: radar_device

  - platform: hlk_ld2402
    id: radar_move
    name: "🏃 运动感应 (Movement)"
    device_class: motion
    hlk_ld2402_id: radar_device

switch:
  - platform: gpio
    pin: 5
    name: "🔌 开关 (Switch)"

# ================= 助手与设置 (Number/Button) =================
number:
  - platform: template
    name: "💳 设置余额 (Set Balance)"
    id: set_bal
    min_value: 0
    max_value: 10000
    step: 1
    optimistic: true
    unit_of_measurement: CNY
    set_action:
      then:
        - lambda: |-
            id(g_balance) = x;

  - platform: template
    name: "📊 设置本月用量 (Set Month Usage)"
    id: set_mon_use
    min_value: 0
    max_value: 10000
    step: 1
    optimistic: true
    unit_of_measurement: kWh
    set_action:
      then:
        - lambda: |-
            id(g_month_usage) = x;

button:
  - platform: template
    name: "🚀 强制初始化数据 (Force Reset All)"
    icon: mdi:nuke
    on_press:
      - lambda: |-
          id(g_today_usage) = 0.0;
          id(g_today_cost) = 0.0;
          id(g_month_usage) = 0.0;
          id(g_month_cost) = 0.0;
          id(g_today_peak_usage) = 0.0;
          id(g_today_valley_usage) = 0.0;
          id(g_month_peak_usage) = 0.0;
          id(g_month_valley_usage) = 0.0;
          id(g_last_energy_reading) = id(pzem_total_energy).state;
          ESP_LOGI("custom", "新年电力数据已手动初始化！");
  - platform: template
    name: "🗑️ 清零今日数据 (Clear Today)"
    on_press:
      - lambda: |-
          id(g_today_usage) = 0.0;
          id(g_today_cost) = 0.0;
          id(g_today_peak_usage) = 0.0;
          id(g_today_peak_cost) = 0.0;
          id(g_today_valley_usage) = 0.0;
          id(g_today_valley_cost) = 0.0;

  - platform: restart
    name: "🔄 重启设备 (Reboot)"
