esphome:
  name: "pwm-fan"
  on_boot:
    priority: 600
    # ...
    then:
      - rtttl.play: "scale_up:d=32,o=5,b=100:c,c#,d#,e,f#,g#,a#,b"
esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable logging
logger:
# Enable Home Assistant API
api:

ota:
  - platform: esphome
substitutions:
  bafakey: "1" #巴法云用户密钥，使用巴法云必须配置正确
  #以下三个为自然风相关，按需修改
  gentle_initial_valuel: "5"  #温柔风初始值
  max_initial_valuel: "20"  #最大值默认值
  min_initial_valuel: "5"  #最小值默认值   
