captive_portal:

web_server:
  port: 80
number:
  - platform: template
    icon: "mdi:fan-plus"
    id: speed_input
    name: "档位"
    lambda: |-
      return id(fan_speed).speed;
    step: 1
    min_value: 0
    max_value: 20
    unit_of_measurement: "档"
    update_interval: 1s
    set_action:
      then:
        - fan.turn_on:
            id: fan_speed
            speed: !lambda "return x ;" 
  - platform: template #number3用于设置自然风的最大值
    id: number3
    name: "1 自然风最大值"
    optimistic: true
    min_value: 5
    max_value: 20
    internal: true
    initial_value: ${max_initial_valuel}
    step: 1
    mode: BOX
  - platform: template #number4用于设置自然风的最小值
    id: number4
    name: "0 自然风最小值"
    optimistic: true
    min_value: 5
    max_value: 20
    initial_value: ${min_initial_valuel}
    step: 1
    mode: BOX
    internal: true
  - platform: template #number5用于设置自然风的最小值
    id: number5
    name: "2 自然风初始值"
    optimistic: true
    min_value: 5
    max_value: 20
    initial_value: ${gentle_initial_valuel}
    step: 1
    mode: BOX
    internal: true
  - platform: template  #number1用于设置及显示定时时间
    name: "自然风定时器"
    id: number1
    #optimistic: true
    min_value: 0
    max_value: 360
    step: 5
    mode: slider
    unit_of_measurement: "分钟"
    icon: mdi:av-timer
    lambda: |-
      return id(countdown_d_duration_value);
    set_action:
      - script.stop: countdown_timer_e_script
      - lambda: |-
          id(countdown_d_duration_value) = x;
      - script.execute: countdown_timer_e_script
  - platform: template #number2用于最后一次操作的时间，秒
    id: number2
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    mode: BOX
output:
  - platform: ledc
    pin:
      number: GPIO20
    id: rtttl_out
    max_power: "1.0"
    frequency: 22 kHz
    channel: 4
    inverted: False
  - platform: ledc
    pin: GPIO5
    frequency: 20000 Hz
    max_power: "0.7"
    id: output_1
    inverted: true
    channel: 0
  - platform: gpio
    pin:
      number: GPIO4
      #inverted: true
      mode:
        output: true
        open_drain: true
    id: 'generic_out'
  - platform: ledc
    pin: GPIO10
    id: my_slow_pwm
    channel: 2
    frequency: 1000 Hz ##internal: true AC引脚
# light:
#   - platform: monochromatic
#     name: "Kitchen Lights"
#     output: my_slow_pwm
#     #internal: true
rtttl:
  output: rtttl_out
fan:
  - platform: speed
    output: output_1
    name: "风扇"
    id: fan_speed
    direction_output: generic_out
    speed_count: 20
    restore_mode: ALWAYS_ON
    on_turn_on:
      - rtttl.play: "scale_up:d=32,o=5,b=100:c,c#,d#,e,f#,g#,a#,b"
switch:
  - platform: template #用于标记定时状态
    id: time_state
    optimistic: true 
  - platform: gpio 
    name: "S启动"
    internal: true
    pin:
      number: GPIO6
      inverted: true
      mode:
        output: true
        open_drain: true
    restore_mode: ALWAYS_ON
sensor:
  - platform: pulse_counter
    pin:
      number: GPIO7
      mode:
        input: true
        pullup: true
    name: "Pulse Counter"
    internal: True
    internal_filter: 13us
    unit_of_measurement: "转"
    accuracy_decimals: 0
    #use_pcnt: true
    update_interval: 10s
    id: pulse_counter_id  # 给脉冲计数器一个 ID

  - platform: template
    name: "Adjusted Pulse Counter"
    id: adjusted_pulse_counter
    unit_of_measurement: "转"
    icon: mdi:pulse
    accuracy_decimals: 0
    lambda: |-
      return id(pulse_counter_id).state / 3.0;
    update_interval: 5s
  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    update_interval: 60s
  - platform: template
    icon: "mdi:fan"
    id: duty
    name: "风扇速度"
    lambda: |-
      return id(fan_speed).speed;
    update_interval: 1s
    accuracy_decimals: 0
    unit_of_measurement: "档"
binary_sensor:
  - platform: gpio 
    name: "米家输出引脚"
    internal: true
    pin:
      number: GPIO1
      inverted: true
    on_press:
      then:
        - lambda: |-
            static int fan_state = 0;  // 用于记录风扇状态的静态变量
            fan_state = (fan_state + 1) % 4;  // 更新状态，循环为0, 1, 2, 3
            // 获取风扇实体
            auto call = id(fan_speed).make_call();
            switch(fan_state) {
              case 0:
                call.set_state(false);  // 关闭风扇
                break;
              case 1:
                call.set_state(true);   // 打开风扇
                call.set_speed(10);      // 设置为低速
                break;
              case 2:
                call.set_speed(15);      // 设置为中速
                break;
              case 3:
                call.set_speed(20);      // 设置为高速
                break;
            }
            call.perform();  // 执行设置
    # on_press:
    #   then:
    #     - lambda: |-
    #         static int fan_state = 0;  // 用于记录风扇状态的静态变量
    #         fan_state = (fan_state + 1) % 4;  // 更新状态，循环为0, 1, 2, 3
