  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    name: "2档"
    internal: true
    id: TEST1
    filters:
      - delayed_on_off: 2s
    on_press:
      - fan.turn_on:
          id: fan_speed
          speed: 15
      - rtttl.play: "key_beep:d=32,o=7,b=120:g"
    on_release:
      then:
        - lambda: 'if (!id(TEST2).state && !id(TEST3).state) id(all_off) = true; else id(all_off) = false;'
        - if:
            condition:
              lambda: 'return id(all_off);'
            then:
              - fan.turn_off: fan_speed
              - rtttl.play: "key_beep:d=32,o=7,b=120:g"
  - platform: gpio
    internal: true
    id: TEST2
    pin:
      number: GPIO2
      inverted: true
      mode:
        input: true
        pullup: true
    name: "3档"
    filters:
      - delayed_on_off: 2s
    on_press:
      - fan.turn_on:
          id: fan_speed
          speed: 20
      - rtttl.play: "key_beep:d=32,o=7,b=120:g"
    on_release:
      then:
        - lambda: 'if (!id(TEST1).state && !id(TEST3).state) id(all_off) = true; else id(all_off) = false;'
        - if:
            condition:
              lambda: 'return id(all_off);'
            then:
              - fan.turn_off: fan_speed
              - rtttl.play: "key_beep:d=32,o=7,b=120:g"
  - platform: gpio
    id: TEST3
    pin:
      number: GPIO3
      inverted: true
      mode:
        input: true
        pullup: true
    name: "1档"
    internal: true
    filters:
      - delayed_on_off: 2s
    on_press:
      - fan.turn_on:
          id: fan_speed
          speed: 8
      - rtttl.play: "key_beep:d=32,o=7,b=120:g"
    on_release:
      then:
        - lambda: 'if (!id(TEST2).state && !id(TEST1).state) id(all_off) = true; else id(all_off) = false;'
        - if:
            condition:
              lambda: 'return id(all_off);'
            then:
              - fan.turn_off: fan_speed
              - rtttl.play: "key_beep:d=32,o=7,b=120:g"
  - platform: gpio
    pin:
      number: GPIO21
      inverted: true
      mode:
        input: true
        pullup: true
    name: "定时器"
    internal: True

interval:  #定义间隔时间组件
  - interval: 1s  # 每秒一次
    then:
      - number.increment:
          id: number2
          cycle: false
      - if:
          condition:  # 按键操作超过12秒才进行动作, 且未开启自然风
            and:
              - lambda: |-
                  return id(mode).state == "关";
              - number.in_range:
                  id: number2
                  above: 12
          then: 
            if:
              condition:
                - fan.is_on: fan_speed
              then:
  - interval: 1min #每分钟执行一次，用于定时
    then:
      - if:
          condition: #判断是否开启了定时
            - switch.is_on: time_state
          then:      #对定时值进行递减
            - number.decrement:
                id: number1
                cycle: false      
      - delay: 1s   #等待1秒              
      - if:
          condition:  #判断定时值，小于等于0
            number.in_range:
              id: number1
              below: 0
          then: 
            if:
              condition:  #档定时开关打开，且值小于等于0，就关风扇
                - switch.is_on: time_state
              then:  
                - fan.turn_off: fan_speed
          else: #大于时，开启定时开关
            - switch.turn_on: time_state 
                             
  - interval: 5s  #自然风,每5秒一次。根据不同模式设置风速
    then:
      if:
        condition:
          and:
            - fan.is_on: fan_speed
        then:
          - if:
              condition:
                - lambda: |-
                    return id(mode).state == "温柔";
              then:
                - lambda: |-
                    int base_speed = id(number5).state;  // 使用number5的值作为基本风速
                    int gust_speed = base_speed + rand() % (static_cast<int>(id(number3).state) - base_speed + 1);  //生成一个随机值
                    int gradient_speed = base_speed + rand() % (static_cast<int>(id(number4).state) - base_speed + 1); //生成一个随机值
                    int new_speed = (base_speed + gust_speed + gradient_speed) / 3;   //取平均
                    //使差值不大于30
                    if (abs(new_speed - id(current_speed)) > 20) {   
                      new_speed = id(current_speed) + (new_speed > id(current_speed) ? 20 : -10);
                    }
                    id(current_speed) = new_speed;  
                    //设置风速
                    auto call = id(fan_speed).turn_on();
                    call.set_speed(new_speed);
                    call.perform();   
          - if:
              condition:
                - lambda: |- 
                    return id(mode).state == "中等";
              then:
                - lambda: |-
                    int min_speed = 8;
                    int max_speed = 16;
                    int new_speed = min_speed + rand() % (max_speed - min_speed + 1);
                    if (abs(new_speed - id(current_speed)) > 16) {
                      new_speed = id(current_speed) + (new_speed > id(current_speed) ? 16 : -16);
                    }
                    id(current_speed) = new_speed;
                    auto call = id(fan_speed).turn_on();
                    call.set_speed(new_speed);
                    call.perform();   
          - if:
              condition:
                - lambda: |-
                    return id(mode).state == "强风";
              then:
                - fan.turn_on:
                    id: fan_speed
                    speed: !lambda 'return 10 + rand() % 21;'
select: #定义选择器
  - platform: template #自然风模式的选择
    name: "自然风模式"
    id: mode
    optimistic: true
    initial_option: 关
    restore_value: true 
    options:
      - 温柔
      - 中等
      - 强风
      - 关
globals: ##定义全局变量
  - id: duty_previous  ##存储占空比值
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: current_speed ##存储风速值，用于自然风
    type: int
    restore_value: no
    initial_value: '10'
  - id: timer_value
    type: int
    initial_value: '0'
  - id: all_off
    type: bool
  - id: oscillation_state
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: countdown_d_duration_value
    type: int
  - id: countdown_d_remaining_time
    type: int
  - id: sequence_script_running
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: fan_speed_state
    type: int
    initial_value: '0'
text_sensor:
  - platform: template
    id: script_status_display
    name: "睡眠状态"
    icon: "mdi:weather-night"
    update_interval: 1s
    lambda: |-
      if (id(sequence_script_running)) {
        return { "启用" };
      } else {
        return { "未开启" };
      }
  - platform: template
    name: "倒计时"
    id: countdown_display_result
    icon: "mdi:timer-outline"
    lambda: |-
      if (id(countdown_display_result)) {
        return { "未开启" }; // Replace this with your desired message when the script is running.
      } else {
        return { "停止" };
      }
script:
  - id: countdown_timer_e_script
    then:
      - lambda: |-
          id(countdown_d_remaining_time) = id(countdown_d_duration_value) * 60;
      - fan.turn_on: fan_speed
      - while:
          condition:
            lambda: 'return id(countdown_d_remaining_time) > 0;'
          then:
            - text_sensor.template.publish:
                id: countdown_display_result
                state: !lambda 'return "提示: " + to_string(id(countdown_d_remaining_time) / 60) + " 分钟 " + to_string(id(countdown_d_remaining_time) % 60) + " 秒后关闭风扇";'
            - delay: 1s
            - lambda: |-
                id(countdown_d_remaining_time) -= 1;
      - fan.turn_off: fan_speed
  - id: sequence_script
    then:
      - globals.set:
          id: sequence_script_running
          value: 'true'
      - select.set:
          id: mode
          option: "强风"
      - delay: 1800s
      - select.set:
          id: mode
          option: "中等"
      - delay: 1800s
      - select.set:
          id: mode
          option: "温柔"
      - delay: 1800s
      - fan.turn_off:
          id: fan_speed
      - globals.set:
          id: sequence_script_running
          value: 'false'
button:
  - platform: template
    name: "终止定时"
    id: start_button
    on_press:
      then:
        - script.stop: sequence_script ##停止睡眠模式
        - script.stop: countdown_timer_e_script ###停止自由时间
        - fan.turn_off: fan_speed ###关闭风扇
        - globals.set:
            id: sequence_script_running
            value: 'false'
        - rtttl.play: "scale_up:d=32,o=5,b=100:c,c#,d#,e,f#,g#,a#,b"
        # - select.set_index:
        #     id: mode
        #     index: 4
  - platform: template
    name: "睡眠风"
    id: start_button3
    icon: mdi:weather-night
    on_press:
      then:
        - fan.turn_on: fan_speed
        - script.execute: sequence_script
